<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Sprout Reads — early reading practice that grows a garden.">
<meta name="theme-color" content="#FBF6EC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sprout Reads">
<title>Sprout Reads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF6EC;
    --paper-dim:#F3ECDD;
    --line:#E4DAC3;
    --ink:#2F4A34;
    --ink-soft:#5B7161;
    --sprout:#6FA85C;
    --sprout-dark:#4F7C41;
    --bloom:#E8674A;
    --bloom-soft:#F5D9CE;
    --soil:#A9764C;
    --sky:#BFDCE3;
    --gold:#E8A93A;
    /* System fallbacks first so a blocked/slow font CDN never breaks the demo */
    --font-display:'Baloo 2', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
    --font-body:'Atkinson Hyperlegible', 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#E4DFD3;
    background-image: radial-gradient(circle at 20% 20%, #ECE7DA 0%, #E4DFD3 60%);
    font-family: var(--font-body);
    padding:24px 12px;
    -webkit-text-size-adjust:100%;
  }

  /* -----------------------------------------------------------
     One app, three contexts.
       Real phone or tablet  -> the app fills the display.
       Laptop demo           -> the app sits in a device frame you
                                can switch between phone and tablet.
     All size-dependent rules below are container queries on .screen,
     so the framed preview and the real device follow the same rules.
     A browser without container query support simply keeps the phone
     layout, which stays readable at any width.
     ----------------------------------------------------------- */
  .stage{ display:flex; flex-direction:column; align-items:center; gap:14px; }

  .device{
    background:#1F2B22;
    position:relative;
    box-shadow: 0 30px 60px -20px rgba(31,43,34,0.45);
  }
  .device.phone{
    width:390px; height:812px;
    max-width:100%; max-height:86vh;
    border-radius:44px; padding:14px;
  }
  .device.phone::before{
    content:"";
    position:absolute;
    top:26px; left:50%;
    transform:translateX(-50%);
    width:90px; height:20px;
    background:#1F2B22;
    border-radius:12px;
    z-index:5;
  }
  .device.tablet{
    width:min(834px, 94vw);
    height:min(1112px, 86vh);
    border-radius:34px; padding:18px;
  }

  .screen{
    background:var(--paper);
    width:100%; height:100%;
    border-radius:32px;
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
    container-type:size;
    container-name:screen;
  }
  .device.tablet .screen{ border-radius:20px; }

  .screen-content{
    --content-max:560px;
    flex:1;
    overflow-y:auto;
    overscroll-behavior:contain;
    padding:56px 22px 100px;
    -webkit-overflow-scrolling:touch;
  }
  .screen-content::-webkit-scrollbar{ width:0; }

  /* Content column. Caps line length even when container queries
     aren't available, so a wide screen never gets 90-character lines. */
  #app{ max-width:var(--content-max); margin:0 auto; }

  /* Frame switcher — laptop demo only, never on a real device. */
  .frame-toggle{ display:none; }
  @media (pointer:fine) and (min-width:900px) and (min-height:700px){
    .frame-toggle{
      display:flex; gap:4px;
      background:rgba(255,255,255,0.75);
      padding:4px; border-radius:100px;
      box-shadow:0 2px 8px rgba(47,74,52,0.1);
    }
    .frame-toggle button{
      border:none; background:none; cursor:pointer;
      font-family:var(--font-display); font-size:13px; font-weight:600;
      color:var(--ink-soft);
      padding:7px 16px; border-radius:100px;
    }
    .frame-toggle button[aria-pressed="true"]{ background:var(--sprout); color:white; }
  }

  /* Real touch devices: drop the frame, take the whole display. */
  @media (pointer:coarse), (max-width:520px), (max-height:700px){
    body{ padding:0; align-items:stretch; justify-content:stretch; background:var(--paper); }
    .stage{ width:100%; gap:0; }
    .device, .device.phone, .device.tablet{
      width:100%; height:100vh; height:100dvh;
      max-width:none; max-height:none;
      border-radius:0; padding:0; box-shadow:none;
    }
    .device.phone::before{ display:none; }
    .screen, .device.tablet .screen{ border-radius:0; }
    .screen-content{
      padding:calc(52px + env(safe-area-inset-top)) 20px calc(104px + env(safe-area-inset-bottom));
    }
    .frame-toggle{ display:none !important; }
  }

  h1,h2,h3{ font-family:var(--font-display); color:var(--ink); margin:0; }
  p{ color:var(--ink); }

  :focus-visible{
    outline:3px solid var(--bloom);
    outline-offset:2px;
    border-radius:6px;
  }

  .fade-in{ animation: fadeIn 0.3s ease; }
  @keyframes fadeIn{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:0.01ms !important;
      animation-iteration-count:1 !important;
      transition-duration:0.01ms !important;
    }
  }

  .sr-only{
    position:absolute; width:1px; height:1px;
    padding:0; margin:-1px; overflow:hidden;
    clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  /* Top bar */
  .topbar{
    position:absolute; top:0; left:0; right:0;
    max-width:var(--content-max);
    margin:0 auto;
    padding:14px 20px 10px;
    display:flex; align-items:center; justify-content:space-between;
    gap:8px;
    z-index:2;
  }
  @media (pointer:coarse), (max-width:520px), (max-height:700px){
    .topbar{ padding-top:calc(14px + env(safe-area-inset-top)); }
  }
  .icon-btn{
    width:44px; height:44px;
    border-radius:14px;
    border:none;
    background:rgba(255,255,255,0.82);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    color:var(--ink);
    font-size:19px;
    font-family:var(--font-body);
    box-shadow: 0 2px 6px rgba(47,74,52,0.08);
  }
  .icon-btn:active{ transform:scale(0.94); }
  .topbar-spacer{ flex:1; }

  /* HOME */
  .home-title{ font-size:26px; line-height:1.15; }
  .home-sub{ color:var(--ink-soft); font-size:14.5px; margin-top:6px; }

  .garden-bed{
    margin-top:20px;
    background: linear-gradient(180deg, var(--sky) 0%, var(--sky) 52%, var(--soil) 52%, var(--soil) 100%);
    border-radius:20px;
    min-height:190px;
    position:relative;
    overflow:hidden;
    padding-bottom:10px;
  }
  .garden-bed .sun{
    position:absolute; top:14px; right:18px;
    width:34px; height:34px; border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 0 6px rgba(232,169,58,0.25);
  }
  .flower-row{
    position:absolute; bottom:10px; left:0; right:0;
    display:flex; justify-content:center; align-items:flex-end;
    gap:8px; flex-wrap:wrap;
    padding:0 14px;
    line-height:1;
  }
  .flower{ animation:sprout-kf 0.7s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes sprout-kf{
    0%{ transform:translateY(10px) scale(0.3); opacity:0; }
    100%{ transform:translateY(0) scale(1); opacity:1; }
  }
  .empty-garden-msg{
    position:absolute; top:48%; left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    width:78%;
    background:rgba(255,255,255,0.94);
    color:var(--ink);
    font-family:var(--font-display);
    font-weight:600;
    font-size:14px;
    line-height:1.4;
    padding:14px 16px;
    border-radius:16px;
    box-shadow:0 6px 16px rgba(47,74,52,0.12);
  }
  .empty-garden-msg .seed-icon{
    font-size:26px;
    display:block;
    margin-bottom:4px;
  }

  .stats-row{ display:flex; gap:10px; margin-top:16px; }
  .stat-card{
    flex:1;
    background:white;
    border-radius:16px;
    padding:12px 8px;
    text-align:center;
    box-shadow:0 4px 14px rgba(47,74,52,0.06);
  }
  .stat-num{ font-family:var(--font-display); font-size:22px; color:var(--sprout-dark); }
  .stat-label{ font-size:11px; color:var(--ink-soft); margin-top:2px; line-height:1.25; }

  .cta-btn{
    margin-top:22px;
    width:100%;
    background:var(--sprout);
    color:white;
    border:none;
    border-radius:18px;
    padding:17px;
    font-family:var(--font-display);
    font-size:17px;
    font-weight:600;
    cursor:pointer;
    box-shadow:0 8px 18px -6px rgba(111,168,92,0.55);
  }
  .cta-btn:active{ transform:scale(0.98); }
  .cta-sub{
    text-align:center;
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:8px;
  }

  .notebook-btn{
    margin-top:12px;
    width:100%;
    background:white;
    border:1.5px solid var(--soil);
    color:var(--soil);
    border-radius:16px;
    padding:14px;
    font-family:var(--font-display);
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }

  /* SHELF */
  .level-head{
    display:flex; align-items:baseline; gap:8px;
    margin:22px 0 8px;
  }
  .level-head h3{ font-size:15px; }
  .level-head span{ font-size:12px; color:var(--ink-soft); }
  .story-card{
    display:flex; align-items:center; gap:14px;
    width:100%;
    text-align:left;
    background:white;
    border:none;
    border-radius:18px;
    padding:14px;
    margin-bottom:10px;
    cursor:pointer;
    font-family:var(--font-body);
    box-shadow:0 4px 14px rgba(47,74,52,0.06);
  }
  .story-card:active{ transform:scale(0.98); }
  .story-cover{
    width:56px; height:56px; border-radius:14px;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:26px;
  }
  .story-info{ flex:1; min-width:0; display:block; }
  .story-title{ display:block; font-family:var(--font-display); font-size:16px; color:var(--ink); }
  .story-meta{ font-size:12.5px; color:var(--ink-soft); margin-top:3px; display:flex; align-items:center; gap:8px; }
  .pip-row{ display:flex; gap:3px; }
  .pip{ width:6px; height:6px; border-radius:50%; background:var(--line); }
  .pip.filled{ background:var(--sprout); }
  .card-flag{
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .done-check{
    width:26px; height:26px; border-radius:50%;
    background:var(--sprout);
    color:white; font-size:14px;
    display:flex; align-items:center; justify-content:center;
  }
  .resume-tag{
    background:var(--bloom-soft);
    color:#A8402A;
    font-size:11px;
    font-family:var(--font-display);
    font-weight:600;
    border-radius:100px;
    padding:4px 9px;
    white-space:nowrap;
  }

  /* READER */
  .story-scene{
    height:150px;
    border-radius:20px;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    margin-bottom:18px;
  }
  .story-scene svg{ width:100%; height:100%; display:block; }
  .page-text{
    font-size:23px;
    line-height:1.75;
    color:var(--ink);
  }
  /* Longer pages step the type down rather than pushing the controls
     off screen. Still well above the 16px floor for early readers. */
  .page-text.long{ font-size:20px; line-height:1.7; }
  .page-text.dense{ font-size:18.5px; line-height:1.68; }

  .page-count{
    text-align:center;
    margin-top:18px;
    font-family:var(--font-display);
    font-size:13px;
    color:var(--ink-soft);
  }
  .mini-bar{
    display:block;
    width:54px; height:6px;
    border-radius:100px;
    background:var(--line);
    overflow:hidden;
  }
  .mini-bar > span{
    display:block; height:100%;
    background:var(--sprout);
    border-radius:100px;
  }
  button{ touch-action:manipulation; }
  .word{
    font:inherit;
    color:inherit;
    background:none;
    border:none;
    cursor:pointer;
    border-radius:6px;
    padding:2px 3px;
    margin:0;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
    transition: background 0.15s ease, color 0.15s ease;
  }
  @media (hover:hover){
    .word:hover{ background:var(--bloom-soft); }
  }
  .word.speaking{ background:var(--bloom); color:white; }
  .word.tapped{ box-shadow: inset 0 -2px 0 var(--gold); }
  .reader-hint{
    margin-top:14px;
    font-size:12.5px;
    color:var(--ink-soft);
    text-align:center;
  }
  .reader-controls{ display:flex; gap:10px; margin-top:20px; }
  .btn-secondary{
    flex:1;
    background:white;
    border:1.5px solid var(--sprout);
    color:var(--sprout-dark);
    border-radius:16px;
    padding:14px;
    font-family:var(--font-display);
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  .btn-secondary[disabled]{ opacity:0.5; cursor:default; }
  .btn-primary{
    flex:1;
    background:var(--sprout);
    border:none;
    color:white;
    border-radius:16px;
    padding:14px;
    font-family:var(--font-display);
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  .page-dots{ display:flex; justify-content:center; gap:6px; margin-top:18px; }
  .page-dot{ width:7px; height:7px; border-radius:50%; background:var(--line); }
  .page-dot.seen{ background:var(--sprout); }
  .page-dot.active{ background:var(--bloom); width:18px; border-radius:4px; }

  /* Scene motion */
  .pulse-el{ transform-box:fill-box; transform-origin:center; animation:pulse-kf 3s ease-in-out infinite; }
  @keyframes pulse-kf{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.08); } }
  .bounce-el{ transform-box:fill-box; transform-origin:center; animation:bounce-kf 1.3s ease-in-out infinite; }
  @keyframes bounce-kf{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-9px); } }
  .wag-el{ transform-box:fill-box; transform-origin:-25px 0px; animation:wag-kf 0.9s ease-in-out infinite; }
  @keyframes wag-kf{ 0%,100%{ transform:rotate(0deg); } 50%{ transform:rotate(22deg); } }
  .bob-el{ animation:bob-kf 2.4s ease-in-out infinite; }
  @keyframes bob-kf{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-4px); } }
  .shimmer-el{ animation:shimmer-kf 2.6s ease-in-out infinite; }
  @keyframes shimmer-kf{ 0%,100%{ opacity:1; } 50%{ opacity:0.55; } }
  .rain-el{ animation:rain-kf 1s linear infinite; opacity:0; }
  @keyframes rain-kf{ 0%{ transform:translateY(-8px); opacity:0; } 30%{ opacity:1; } 100%{ transform:translateY(14px); opacity:0; } }
  .rain-delay1{ animation-delay:0.3s; }
  .rain-delay2{ animation-delay:0.6s; }
  .grow-in{ transform-box:fill-box; transform-origin:bottom center; animation:grow-in-kf 1.1s ease-out both; }
  @keyframes grow-in-kf{ 0%{ transform:scaleY(0.2); opacity:0.3; } 100%{ transform:scaleY(1); opacity:1; } }
  .bloom-in{ transform-box:fill-box; transform-origin:center; animation:bloom-in-kf 0.9s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes bloom-in-kf{ 0%{ transform:scale(0.2) rotate(-10deg); opacity:0; } 70%{ transform:scale(1.12) rotate(4deg); opacity:1; } 100%{ transform:scale(1) rotate(0deg); } }

  /* Pip helper */
  .pip-widget{
    position:absolute; right:12px; bottom:14px;
    width:64px; height:80px;
    z-index:30;
    display:flex; align-items:flex-end; justify-content:center;
    cursor:pointer;
    background:none; border:none; padding:0;
  }
  @media (pointer:coarse), (max-width:520px), (max-height:700px){
    .pip-widget{ bottom:calc(14px + env(safe-area-inset-bottom)); }
  }
  .pip-figure{
    width:54px; height:68px;
    filter:drop-shadow(0 4px 6px rgba(47,74,52,0.2));
    animation:pip-idle-kf 2.6s ease-in-out infinite;
  }
  @keyframes pip-idle-kf{ 0%,100%{ transform:translateY(0) rotate(0deg); } 50%{ transform:translateY(-5px) rotate(-2deg); } }
  .pip-figure.cheer{ animation:pip-cheer-kf 0.6s ease-in-out 2; }
  @keyframes pip-cheer-kf{
    0%,100%{ transform:translateY(0) rotate(0deg) scale(1); }
    30%{ transform:translateY(-15px) rotate(9deg) scale(1.08); }
    60%{ transform:translateY(0) rotate(-6deg) scale(1.04); }
  }
  .pip-bubble{
    position:absolute; bottom:70px; right:0;
    max-width:170px;
    background:white;
    border:1.5px solid var(--sprout);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:12.5px;
    line-height:1.35;
    border-radius:14px 14px 4px 14px;
    padding:8px 10px;
    box-shadow:0 4px 12px rgba(47,74,52,0.14);
    opacity:0;
    transform:translateY(6px);
    transition:opacity 0.25s ease, transform 0.25s ease;
    pointer-events:none;
    text-align:left;
  }
  .pip-bubble.show{ opacity:1; transform:translateY(0); }

  /* Word info panel */
  .word-info-panel{
    margin-top:16px;
    background:white;
    border-radius:16px;
    padding:14px 16px;
    box-shadow:0 4px 14px rgba(47,74,52,0.06);
    border:1.5px dashed var(--line);
  }
  .word-info-panel.empty{ text-align:center; color:var(--ink-soft); font-size:13px; }
  .word-info-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .word-info-word{ font-family:var(--font-display); font-size:19px; color:var(--ink); }
  .word-info-def{ font-size:14px; color:var(--ink-soft); line-height:1.45; }
  .word-info-def-row{ display:flex; align-items:flex-start; gap:8px; margin-top:6px; }
  .word-info-def-row .word-info-def{ flex:1; }
  .save-word-btn{
    border:1.5px solid var(--gold);
    background:white;
    color:var(--soil);
    border-radius:100px;
    padding:8px 13px;
    font-size:12.5px;
    font-family:var(--font-display);
    font-weight:600;
    cursor:pointer;
    flex-shrink:0;
  }
  .save-word-btn.saved{ background:var(--gold); color:white; border-color:var(--gold); }

  /* CHECK (end-of-story vocabulary check) */
  .check-card{
    background:white;
    border-radius:20px;
    padding:20px 18px;
    box-shadow:0 6px 18px rgba(47,74,52,0.08);
    margin-top:16px;
  }
  .check-progress{ font-size:12.5px; color:var(--ink-soft); }
  .check-prompt{
    font-family:var(--font-display);
    font-size:18px;
    color:var(--ink);
    line-height:1.35;
    margin-top:8px;
  }
  .check-choices{ display:flex; flex-direction:column; gap:10px; margin-top:16px; }
  .choice-btn{
    background:var(--paper-dim);
    border:1.5px solid var(--line);
    color:var(--ink);
    border-radius:14px;
    padding:15px;
    font-family:var(--font-display);
    font-size:17px;
    font-weight:600;
    cursor:pointer;
    text-align:left;
  }
  .choice-btn.right{ background:var(--sprout); border-color:var(--sprout); color:white; }
  .choice-btn.wrong{ background:var(--bloom-soft); border-color:var(--bloom); color:#A8402A; }
  .check-feedback{ margin-top:14px; font-size:14px; color:var(--ink-soft); min-height:20px; }

  /* NOTEBOOK */
  .notebook-cover{ background:var(--soil); border-radius:18px; padding:3px; }
  .notebook-inner{
    background: repeating-linear-gradient(white, white 30px, #E7EFE0 31px);
    border-radius:15px;
    position:relative;
    padding:10px 14px 10px 30px;
    min-height:120px;
  }
  .notebook-margin{ position:absolute; left:22px; top:0; bottom:0; width:1.5px; background:var(--bloom-soft); }
  .spiral-col{
    position:absolute; left:-3px; top:14px; bottom:14px;
    width:10px;
    display:flex; flex-direction:column; justify-content:space-between;
  }
  .spiral-ring{ width:10px; height:10px; border-radius:50%; background:var(--paper); border:2px solid var(--ink-soft); }
  .notebook-entry{
    padding:12px 4px 12px 6px;
    border-bottom:1px dashed #D8CDA9;
    display:flex; justify-content:space-between; align-items:flex-start;
    gap:10px;
  }
  .notebook-entry:last-child{ border-bottom:none; }
  .notebook-word{ font-family:var(--font-display); font-size:19px; color:var(--ink); }
  .notebook-def{ font-size:13.5px; color:var(--ink-soft); margin-top:3px; line-height:1.4; }

    display:flex; flex-direction:column; align-items:center; gap:4px;
    box-shadow:0 4px 14px rgba(47,74,52,0.06);

    .band-blurb{ font-size:16px; }
    .band-count{ font-size:14px; }
    .band-badge{ font-size:15px; padding:8px 16px; }
    .band-chip{ font-size:15px; padding:12px 18px; }

    .alphabet-grid{ grid-template-columns:repeat(6, 1fr); gap:14px; }
    .letter-tile{ padding:18px 8px 14px; border-radius:22px; }

    .tile-emoji{ font-size:24px; }
    .letter-big{ font-size:104px; }
    .letter-emoji{ font-size:52px; }

    .pip-widget{ width:86px; height:106px; right:20px; bottom:20px; }

  @container screen (min-width: 840px){

<script>
/* ============================================================
   0. THE VOICE BOX
   ------------------------------------------------------------
   Put your own recordings here. Until you do, every sound falls
   back to the device's built-in voice, so the app always works.

   WHERE THE FILES GO

     voices/name/a.mp3       the letter's NAME  ("ay", "bee")
     voices/sound/a.mp3      the letter's SOUND ("aaa", "buh")
     voices/word/apple.mp3   one spoken word, named after the word
     voices/def/apple.mp3    the spoken definition of that word
     voices/page/seed-0.mp3  story "seed", page 1 (0-based)

   TWO WAYS TO ADD VOICES
   ----------------------
   1. A folder. Set enabled:true, drop a "voices" folder next to
      this file, and name files as above.

   2. One clip at a time, in `clips` — handy for odd filenames or
      for testing a single recording:

        clips: {
          'sound/a':    'voices/my-recording-of-a.m4a',
          'word/mango': 'https://example.org/mango.mp3',
          'name/b':     'data:audio/mp3;base64,SUQzBAAA...'

   file is not an error — that one sound uses the built-in voice
   instead. 26 letters means 52 clips for a full set. Check what
   loaded under Settings → For grown-ups → Voice pack.

   OPTIONAL: word timing for recorded story pages.
   If you record a whole page, list the second each word starts at
   and the words still light up as your voice reads them:

     timings: { 'page/seed-0': [0, 0.42, 0.95, 1.4, 1.9] }
   ============================================================ */

const VOICES = {
  enabled: false,          // set to true once the voices folder exists
  basePath: 'voices/',
  format: 'mp3',

  timings: {}
};



/* ============================================================
   1. CONTENT

   words to LIBRARY.words. No other code changes.
   ============================================================ */

const PACK_EN = {

    alreadyPlanted:"is already in your garden. Reading it twice makes it easier every time.",
    seeGarden:"See my garden", newStory:"Read a new story", backToShelf:"Back to the shelf",
    finishPip:"Wonderful reading. You did it.", finishPipAgain:"Even better the second time.",

   2. STATE + STORAGE
   ============================================================ */

const STORAGE_KEY = 'sproutreads.v1';

const state = {
  screen:'home',
  storyId:null,
  page:0,
  completed:new Set(),      // story ids finished at least once
  pagesSeen:new Set(),      // "storyId:pageIndex" — a real page counter
  wordsMet:new Set(),       // non-sight words encountered in a finished page
  savedWords:new Map(),     // word -> definition, chosen by the child
  lettersHeard:new Set(),   // letters explored in the phonics screen
  band:null,                // chosen age band; null until the welcome screen
  bookmarks:{},             // storyId -> last page reached
  sound:true,
  pipGreeted:false,
  // transient, not persisted
  check:null,
  tappedThisPage:new Set()
};

function save(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      completed:[...state.completed],
      pagesSeen:[...state.pagesSeen],
      wordsMet:[...state.wordsMet],
      savedWords:[...state.savedWords],
      lettersHeard:[...state.lettersHeard],
      band:state.band,
      bookmarks:state.bookmarks,
      sound:state.sound
    }));
  }catch(e){
    /* Private mode, file:// restrictions, or a full disk. The app keeps
       working from memory for this session — never block on storage. */
  }
}

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const d = JSON.parse(raw);
    state.completed = new Set(d.completed || []);
    state.pagesSeen = new Set(d.pagesSeen || []);
    state.wordsMet = new Set(d.wordsMet || []);
    state.savedWords = new Map(d.savedWords || []);
    state.lettersHeard = new Set(d.lettersHeard || []);
    state.band = d.band || null;
    state.bookmarks = d.bookmarks || {};
    state.sound = d.sound !== false;
  }catch(e){ /* corrupt or unreadable — start fresh rather than crash */ }
}

function resetProgress(){
  state.completed.clear();
  state.pagesSeen.clear();
  state.wordsMet.clear();
  state.savedWords.clear();
  state.lettersHeard.clear();
  state.bookmarks = {};
  state.band = null;
  state.pipGreeted = true;
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
}

const storyById = id => LIBRARY.stories.find(s => s.id === id);
const storyIndex = id => LIBRARY.stories.findIndex(s => s.id === id);

/* Combining marks (\p{M}) are kept so accented and non-Latin text
   survives word cleaning intact. */
function cleanWord(w){ return w.replace(/[^\p{L}\p{M}\p{N}'-]/gu, '').toLowerCase(); }
function defFor(w){ return LIBRARY.words[cleanWord(w)] || T('unknownWord'); }
function isSightWord(w){ return LIBRARY.sightWords ? LIBRARY.sightWords.has(cleanWord(w)) : false; }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function wordSpansOf(text){
  const spans = [];
  const re = /\S+/g;
  let m;
  while((m = re.exec(text)) !== null){
    spans.push({ start:m.index, end:m.index + m[0].length, text:m[0] });
  }
  return spans;
}

    ${petals}
    <circle cx="0" cy="0" r="8" fill="${d.center}"/>
  </svg>`;
}

function greeting(){
  const h = new Date().getHours();
  if(h < 12) return T('morning');
  if(h < 17) return T('afternoon');
  return T('evening');
}

function pagesReadIn(storyId){
  let n = 0;
  const story = storyById(storyId);
  if(!story) return 0;
  for(let i = 0; i < story.pages.length; i++){
    if(state.pagesSeen.has(storyId + ':' + i)) n++;
  }
  return n;
}

function markPageRead(story, pageIndex){
  state.pagesSeen.add(story.id + ':' + pageIndex);
  wordSpansOf(story.pages[pageIndex]).forEach(sp => {
    const w = cleanWord(sp.text);
    if(w && !isSightWord(w)) state.wordsMet.add(w);
  });
  // Furthest page reached, not the most recent one — going back to re-read
  // an earlier page must not lose the child's place.
  const furthest = Math.min(pageIndex + 1, story.pages.length - 1);
  state.bookmarks[story.id] = Math.max(state.bookmarks[story.id] || 0, furthest);
  save();
}

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ============================================================
   4. SPEECH
   Voices load asynchronously and word-boundary events are
   unreliable outside Chrome, so both are handled defensively.
   ============================================================ */

const speech = {
  supported: typeof window !== 'undefined' && 'speechSynthesis' in window,
  voice: null,
  ready: false
};

function pickVoice(){
  if(!speech.supported) return;
  const voices = speechSynthesis.getVoices();
  if(!voices.length) return;

  // Take an English voice or none at all — a mismatched voice reads
  // worse than silence, and the grown-ups panel reports the gap.
  const want = SPEECH_LANG.toLowerCase();
  const base = want.split('-')[0];
  speech.voice =
    voices.find(v => v.lang && v.lang.toLowerCase() === want) ||
    voices.find(v => v.lang && v.lang.toLowerCase().startsWith(base)) ||
    null;
  speech.missingVoice = !speech.voice;
  speech.ready = true;
}

if(speech.supported){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}

function stopSpeech(){
  if(speech.supported) speechSynthesis.cancel();
  clearInterval(window.__karaokeTimer);
}

/**
 * Speak text. onWord(charIndex) fires per word when the browser
 * supports boundary events; otherwise an estimated timer drives the
 * same callback so highlighting still works on Safari and Firefox.
 */
function speakText(text, onWord, onDone){
  if(!speech.supported || !state.sound){ if(onDone) onDone(); return; }
  stopSpeech();

  const utter = new SpeechSynthesisUtterance(text);
  if(speech.voice) utter.voice = speech.voice;
  utter.lang = SPEECH_LANG;
  utter.rate = 0.82;
  utter.pitch = 1.05;

  let boundaryFired = false;
  if(onWord){
    utter.onboundary = e => {
      if(e.name === 'word' || e.name === undefined){
        boundaryFired = true;
        clearInterval(window.__karaokeTimer);
        onWord(e.charIndex);
      }
    };
  }

  utter.onend = () => { clearInterval(window.__karaokeTimer); if(onDone) onDone(); };
  utter.onerror = () => { clearInterval(window.__karaokeTimer); if(onDone) onDone(); };

  speechSynthesis.speak(utter);

  // Fallback highlighting: if no boundary event arrives shortly after
  // speech starts, step through the words on an estimated cadence.
  if(onWord){
    const spans = wordSpansOf(text);
    setTimeout(() => {
      if(boundaryFired || !speechSynthesis.speaking) return;
      let i = 0;
      const perWord = 420; // ~ rate 0.82 on a short beginner sentence
      onWord(spans[0] ? spans[0].start : 0);
      window.__karaokeTimer = setInterval(() => {
        i++;
        if(i >= spans.length || !speechSynthesis.speaking){
          clearInterval(window.__karaokeTimer);
          return;
        }
        onWord(spans[i].start);
      }, perWord);
    }, 350);
  }
}

/* ---- Recorded clips -----------------------------------------
   Resolves a key like 'sound/a' to your recording if there is one,
   and otherwise hands off to the built-in voice. Nothing here can
   make a sound fail to play — the worst case is a different voice. */

let currentAudio = null;
const missingClips = new Set();   // keys we've already tried and failed
const foundClips = new Set();

function clipUrl(key){
  if(VOICES.clips && VOICES.clips[key]) return VOICES.clips[key];
  if(VOICES.enabled) return VOICES.basePath + key + '.' + VOICES.format;
  return null;
}

function stopAudio(){
  if(currentAudio){
    currentAudio.pause();
    currentAudio.onended = currentAudio.onerror = currentAudio.ontimeupdate = null;
    currentAudio = null;
  }
}

function stopAll(){ stopSpeech(); stopAudio(); }

/**
 * Play a sound by key, e.g. play('sound/a', 'ahh').
 * fallbackText is what the built-in voice says if there's no clip.
 * onWordTime(index) fires per word when a page recording has timings.
 */
function play(key, fallbackText, onDone, onWordTime){
  if(!state.sound){ if(onDone) onDone(); return; }
  stopAll();

  const url = key && !missingClips.has(key) ? clipUrl(key) : null;
  if(!url){
    speakText(fallbackText, onWordTime ? null : null, onDone);
    return;
  }

  const audio = new Audio(url);
  currentAudio = audio;

  const fallBack = () => {
    missingClips.add(key);
    stopAudio();
    speakText(fallbackText, null, onDone);
  };

  audio.onerror = fallBack;
  audio.onended = () => { stopAudio(); if(onDone) onDone(); };
  audio.oncanplay = () => foundClips.add(key);

  const times = VOICES.timings && VOICES.timings[key];
  if(times && onWordTime){
    let last = -1;
    audio.ontimeupdate = () => {
      let i = -1;
      for(let n = 0; n < times.length; n++){ if(audio.currentTime >= times[n]) i = n; }
      if(i !== last){ last = i; onWordTime(i); }
    };
  }

  audio.play().catch(fallBack);
}

/** Speak a word, preferring a recording of that exact word. */
function sayWord(word, onDone){
  play('word/' + cleanWord(word), word, onDone);
}

/** Report which recordings actually load. Used by the grown-ups panel. */
function checkVoicePack(keys, done){
  const results = { found:[], missing:[] };
  let pending = keys.length;
  if(!pending) return done(results);

  keys.forEach(key => {
    const url = clipUrl(key);
    if(!url){ results.missing.push(key); if(--pending === 0) done(results); return; }
    const a = new Audio();
    let settled = false;
    const finish = ok => {
      if(settled) return;
      settled = true;
      (ok ? results.found : results.missing).push(key);
      if(--pending === 0) done(results);
    };
    a.onloadedmetadata = () => finish(true);
    a.oncanplaythrough = () => finish(true);
    a.onerror = () => finish(false);
    setTimeout(() => finish(false), 4000);
    a.preload = 'metadata';
    a.src = url;
  });
}

/* ============================================================
   5. PIP
   ============================================================ */

function pipSay(text, mood){
  const bubble = document.getElementById('pip-bubble');
  const figure = document.getElementById('pip-figure');
  if(!bubble || !figure) return;
  bubble.textContent = text;
  bubble.classList.add('show');
  if(mood === 'cheer') figure.classList.add('cheer');
  clearTimeout(window.__pipTimer);
  window.__pipTimer = setTimeout(() => {
    bubble.classList.remove('show');
    figure.classList.remove('cheer');
  }, 3600);
}

/* ============================================================
   6. ROUTER
   ============================================================ */

function go(screen, opts = {}){
  stopAll();
  Object.assign(state, opts);
  state.screen = screen;
  render();
}

const SCREENS = {
  welcome: renderWelcome,
  home: renderHome,
  shelf: renderShelf,
  reader: renderReader,
  check: renderCheck,
  finish: renderFinish,
  notebook: renderNotebook,
  phonics: renderPhonics,
  letter: renderLetter,
  grownups: renderGrownups
};

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.classList.remove('fade-in');
  void app.offsetWidth;
  app.classList.add('fade-in');
  (SCREENS[state.screen] || renderHome)(app);
  const content = document.querySelector('.screen-content');
  if(content) content.scrollTop = 0;
}

function backBar(app, onBack, rightHtml){
  const bar = document.createElement('div');
  bar.className = 'topbar';
  bar.innerHTML = `
    <button class="icon-btn" id="back-btn" aria-label="Go back">←</button>
    <div class="topbar-spacer"></div>
    ${rightHtml || ''}
  `;
  app.prepend(bar);
  bar.querySelector('#back-btn').onclick = onBack;
  return bar;
}

function renderShelf(app){
  const myBand = LIBRARY.bands[state.band] || LIBRARY.bands.sprout;

  app.innerHTML = `
    <h2 style="font-size:22px;">${escapeHtml(T('shelfTitle'))}</h2>

  `;

  const list = app.querySelector('#story-list');

      <h3>${band.emoji} ${escapeHtml(band.name)}</h3>

function storyCard(story){
  const done = state.completed.has(story.id);
  const read = pagesReadIn(story.id);
  const startAt = done ? 0 : (state.bookmarks[story.id] || 0);
  const resuming = !done && startAt > 0;

  const card = document.createElement('button');
  card.className = 'story-card';
  // Ten pips is noise. Long stories get a bar and a fraction instead.
  const progress = story.pages.length > 6
    ? `<span class="mini-bar" aria-hidden="true">
         <span style="width:${Math.round(read / story.pages.length * 100)}%"></span>
       </span>
       <span>${read}/${story.pages.length}</span>`
    : `<span class="pip-row" aria-hidden="true">
         ${story.pages.map((_, i) => `<span class="pip ${i < read ? 'filled' : ''}"></span>`).join('')}
       </span>`;

  card.innerHTML = `
    <span class="story-cover" style="background:${story.bg}" aria-hidden="true">${story.emoji}</span>
    <span class="story-info">
      <span class="story-title">${escapeHtml(story.title)}</span>
      <span class="story-meta">
        <span>${story.pages.length} ${escapeHtml(T('pages'))}</span>
        ${progress}
      </span>
    </span>
    <span class="card-flag">
      ${done ? '<span class="done-check" aria-hidden="true">✓</span>'
             : resuming ? `<span class="resume-tag">page ${startAt + 1}</span>` : ''}
    </span>
  `;
  card.setAttribute('aria-label',
    `${story.title}, ${story.pages.length} pages` +
    (done ? ', finished' : resuming ? `, continue from page ${startAt + 1}` : ''));
  card.onclick = () => go('reader', { storyId:story.id, page:startAt, tappedThisPage:new Set() });
  return card;
}

function defaultScene(story, pageIndex){
  // A story can vary its picture page by page via pageEmoji, which
  // matters once stories run past a few pages — one repeated image
  // across ten pages reads as a bug.
  const emoji = (story.pageEmoji && story.pageEmoji[pageIndex]) || story.emoji;
  return `
    <svg viewBox="0 0 320 160" role="img" aria-label="A picture for ${escapeHtml(story.title)}">
      <rect x="0" y="124" width="320" height="36" fill="#BFE2A0"/>
      <circle class="pulse-el" cx="270" cy="30" r="16" fill="#E8A93A"/>
      <g class="bob-el">
        <text x="160" y="104" font-size="62" text-anchor="middle">${emoji}</text>
      </g>
    </svg>`;
}

function sceneFor(story, pageIndex){
  const s = SCENES[story.id];
  if(typeof s === 'function') return s(pageIndex, story);
  return s || defaultScene(story, pageIndex);
}

function renderReader(app){
  const story = storyById(state.storyId);
  if(!story) return go('shelf');

  const text = story.pages[state.page];
  const spans = wordSpansOf(text);
  const isLast = state.page === story.pages.length - 1;

  // Type scales down as the page gets longer, so a two-sentence
  // Bloomer page fits without the child scrolling mid-sentence.
  const density = spans.length >= 20 ? ' dense' : spans.length >= 12 ? ' long' : '';

  // Past eight pages a dot strip stops being readable as progress.
  const longStory = story.pages.length > 8;
  const progressMarkup = longStory
    ? `<div class="page-count">${escapeHtml(T('page'))} ${state.page + 1} ${escapeHtml(T('of'))} ${story.pages.length}</div>`
    : `<div class="page-dots" aria-hidden="true">
        ${story.pages.map((_, i) => {
          const seen = state.pagesSeen.has(story.id + ':' + i);
          return `<span class="page-dot ${i === state.page ? 'active' : seen ? 'seen' : ''}"></span>`;
        }).join('')}
      </div>`;

  app.innerHTML = `
    <div class="reader-grid">
      <div class="reader-media">
        <div class="story-scene" style="background:${story.bg}">${sceneFor(story, state.page)}</div>
      </div>
      <div class="reader-body">
        <p class="page-text${density}" id="page-text"></p>
        <p class="reader-hint">${escapeHtml(T('tapHint'))}</p>
        <div class="word-info-panel empty" id="word-info-panel" role="region" aria-live="polite">
          ${escapeHtml(T('tapPanel'))}
        </div>
        <div class="reader-controls">
          <button class="btn-secondary" id="read-to-me" ${speech.supported ? '' : 'disabled'}>
            🔊 ${escapeHtml(T('readToMe'))}
          </button>
          <button class="btn-primary" id="next-btn">${escapeHtml(isLast ? T('finishStory') : T('nextPage'))}</button>
        </div>
        ${progressMarkup}
      </div>
    </div>
    <p class="sr-only">Page ${state.page + 1} of ${story.pages.length}. ${escapeHtml(text)}</p>
  `;

  backBar(app,
    () => go(state.page > 0 ? 'reader' : 'shelf', state.page > 0 ? { page:state.page - 1, tappedThisPage:new Set() } : {}),
    `<button class="icon-btn" id="home-btn" aria-label="Go to garden">⌂</button>`
  );
  app.querySelector('#home-btn').onclick = () => go('home');

  // Rebuild the line from the spans, putting back whatever sat between
  // them, so spacing and punctuation survive exactly as written.
  const line = app.querySelector('#page-text');
  const wordEls = [];
  let cursor = 0;
  spans.forEach((sp, i) => {
    if(sp.start > cursor){
      line.appendChild(document.createTextNode(text.slice(cursor, sp.start)));
    }
    const b = document.createElement('button');
    b.className = 'word';
    b.type = 'button';
    b.textContent = sp.text;
    b.setAttribute('aria-label', cleanWord(sp.text));
    if(state.tappedThisPage.has(i)) b.classList.add('tapped');
    b.onclick = () => {
      stopAll();
      const w = cleanWord(sp.text);
      state.tappedThisPage.add(i);
      b.classList.add('tapped', 'speaking');
      sayWord(w, () => b.classList.remove('speaking'));
      showWordInfo(app, w);
    };
    line.appendChild(b);
    wordEls.push(b);
    cursor = sp.end;
  });
  if(cursor < text.length) line.appendChild(document.createTextNode(text.slice(cursor)));

  app.querySelector('#read-to-me').onclick = () => {
    const clear = () => wordEls.forEach(el => el.classList.remove('speaking'));
    const highlightAt = idx => { clear(); if(idx >= 0 && wordEls[idx]) wordEls[idx].classList.add('speaking'); };
    clear();

    const pageKey = 'page/' + story.id + '-' + state.page;
    if(clipUrl(pageKey) && !missingClips.has(pageKey)){
      // A recording of the whole page. Words light up only if you've
      // supplied timings for it; otherwise it just plays.
      play(pageKey, text, clear, highlightAt);
    } else {
      speakText(text, charIndex => {
        highlightAt(spans.findIndex(w => charIndex >= w.start && charIndex < w.end));
      }, clear);
    }
  };

  app.querySelector('#next-btn').onclick = () => {
    stopAll();
    markPageRead(story, state.page);
    if(!isLast){
      go('reader', { page:state.page + 1, tappedThisPage:new Set() });
    } else {
      startCheck(story);
    }
  };
}

    <div class="word-info-def-row">
      <button class="mini-icon-btn" id="hear-def" aria-label="Hear what this word means">🔊</button>
      <span class="word-info-def">${escapeHtml(def)}</span>
    </div>
  `;
  panel.querySelector('#save-toggle').onclick = () => {
    if(state.savedWords.has(word)){
      state.savedWords.delete(word);
    } else {
      state.savedWords.set(word, def);
      pipSay(T('savedPip'), 'cheer');
    }
    save();
    showWordInfo(app, word);
  };
  panel.querySelector('#hear-def').onclick = () => play('def/' + word, def);
}

/* ---- End-of-story check -------------------------------------
   Two quick questions built from the story's own featured words.
   New stories get a check for free — no extra authoring.        */

function buildCheck(story){
  const band = LIBRARY.bands[story.band] || {};
  const wanted = band.checkQuestions || 2;
  const pool = story.featured.map(cleanWord).filter(w => LIBRARY.words[w]);
  const asked = shuffle(pool).slice(0, Math.min(wanted, pool.length));
  return asked.map(answer => {
    const distractors = shuffle(pool.filter(w => w !== answer)).slice(0, 2);
    return {
      answer,
      prompt: LIBRARY.words[answer],
      choices: shuffle([answer, ...distractors])
    };
  });
}

function startCheck(story){
  // Seedlings finish straight into the flower. A vocabulary quiz is the
  // wrong ending for a three-year-old, so their band opts out entirely.
  const band = LIBRARY.bands[story.band];
  if(band && band.check === false) return completeStory(story);

  const questions = buildCheck(story);
  if(!questions.length) return completeStory(story);
  state.check = { questions, index:0, correct:0, answered:false };
  go('check');
}

function renderCheck(app){
  const story = storyById(state.storyId);
  const check = state.check;
  if(!story || !check) return go('home');

  const q = check.questions[check.index];

  app.innerHTML = `
    <h2 style="font-size:21px;">${escapeHtml(T('checkTitle'))}</h2>
    <p class="home-sub">${escapeHtml(T('checkSub'))}</p>
    <div class="check-card">
      <div class="check-progress">${escapeHtml(T('question'))} ${check.index + 1} ${escapeHtml(T('of'))} ${check.questions.length}</div>
      <p class="check-prompt">${escapeHtml(q.prompt)}</p>
      <div class="check-choices" id="choices"></div>
      <div class="check-feedback" id="feedback" role="status" aria-live="polite"></div>
    </div>
    <div class="reader-controls">
      <button class="btn-secondary" id="hear-prompt">🔊 ${escapeHtml(T('readItToMe'))}</button>
      <button class="btn-primary" id="skip-btn">${escapeHtml(T('skipThis'))}</button>
    </div>
  `;

  backBar(app, () => go('reader', { page:story.pages.length - 1, tappedThisPage:new Set() }));

  const choicesEl = app.querySelector('#choices');
  const feedback = app.querySelector('#feedback');

  q.choices.forEach(choice => {
    const b = document.createElement('button');
    b.className = 'choice-btn';
    b.type = 'button';
    b.textContent = choice;
    b.onclick = () => {
      if(check.answered) return;
      const right = choice === q.answer;
      b.classList.add(right ? 'right' : 'wrong');
      sayWord(choice);

      if(right){
        check.answered = true;
        check.correct++;
        feedback.textContent = T('rightAnswer');
        setTimeout(nextCheckQuestion, 1100);
      } else {
        // Wrong answers aren't failures — the choice stays open.
        feedback.textContent = T('wrongAnswer');
        b.disabled = true;
      }
    };
    choicesEl.appendChild(b);
  });

  app.querySelector('#hear-prompt').onclick = () => play('def/' + q.answer, q.prompt);
  app.querySelector('#skip-btn').onclick = () => { check.answered = true; nextCheckQuestion(); };

  function nextCheckQuestion(){
    if(check.index < check.questions.length - 1){
      check.index++;
      check.answered = false;
      go('check');
    } else {
      completeStory(story);
    }
  }
}

function completeStory(story){
  const firstTime = !state.completed.has(story.id);
  state.completed.add(story.id);
  story.pages.forEach((_, i) => state.pagesSeen.add(story.id + ':' + i));
  story.pages.forEach(p => wordSpansOf(p).forEach(sp => {
    const w = cleanWord(sp.text);
    if(w && !isSightWord(w)) state.wordsMet.add(w);
  }));
  delete state.bookmarks[story.id];
  save();
  go('finish', { firstTime });
}

function renderFinish(app){
  const story = storyById(state.storyId);
  if(!story) return go('home');
  const firstTime = state.firstTime !== false;
  const nextStory =
    LIBRARY.stories.find(s => s.band === state.band && !state.completed.has(s.id)) ||
    LIBRARY.stories.find(s => !state.completed.has(s.id));

  app.innerHTML = `
    <div class="finish-wrap">
      <div class="bloom-badge">${flowerSvg(story.id, 96, story.title)}</div>
      <h2 style="margin-top:6px; font-size:22px;">
        ${escapeHtml(firstTime ? T('grewFlower') : T('readAgain'))}
      </h2>
      <p class="home-sub" style="margin-top:6px;">
        “${escapeHtml(story.title)}” ${escapeHtml(firstTime ? T('plantedNow') : T('alreadyPlanted'))}
      </p>
      <button class="cta-btn" id="see-garden" style="margin-top:24px;">${escapeHtml(T('seeGarden'))}</button>
      <button class="btn-secondary" id="another-story" style="width:100%; margin-top:12px;">
        ${escapeHtml(nextStory ? T('newStory') : T('backToShelf'))}
      </button>
    </div>
  `;
  app.querySelector('#see-garden').onclick = () => go('home');
  app.querySelector('#another-story').onclick = () =>
    nextStory ? go('reader', { storyId:nextStory.id, page:0, tappedThisPage:new Set() }) : go('shelf');

  setTimeout(() => pipSay(firstTime ? T('finishPip') : T('finishPipAgain'), 'cheer'), 350);
}

/* ---- Phonics ------------------------------------------------ */

const letterData = l => LIBRARY.phonics.find(p => p.letter === l);

/** Letters show both cases: Aa. */
function letterDisplay(p){ return p.letter.toUpperCase() + p.letter; }

function renderPhonics(app){

  `;
  backBar(app, () => go('home'));

  const grid = app.querySelector('#alphabet-grid');

function renderLetter(app){
  const p = letterData(state.letter) || LIBRARY.phonics[0];

  const next = LIBRARY.phonics[i + 1];

  state.lettersHeard.add(p.letter);
  save();

  app.innerHTML = `
    <div class="letter-card">
      <div class="letter-big" aria-hidden="true">${letterDisplay(p)}</div>
      <div class="letter-keyword">

    ${p.note ? `<p class="letter-note">${escapeHtml(p.note)}</p>` : ''}

    <div class="reader-controls">
      <button class="btn-secondary" id="prev-letter" ${prev ? '' : 'disabled'}>
        ${prev ? '← ' + prev.letter.toUpperCase() : '←'}
      </button>
      <button class="btn-primary" id="next-letter" ${next ? '' : 'disabled'}>
        ${next ? next.letter.toUpperCase() + ' →' : '→'}
      </button>
    </div>
  `;
  backBar(app, () => go('phonics'));

  const chips = app.querySelector('#example-chips');
  p.examples.forEach(word => {
    const chip = document.createElement('button');
    chip.className = 'example-chip';
    chip.type = 'button';
    chip.setAttribute('aria-label', `Hear the word ${word}`);
    // The letter being practised is marked inside each example.
    chip.innerHTML = word.split('').map(ch =>
      ch === p.letter ? `<span class="chip-focus">${escapeHtml(ch)}</span>` : escapeHtml(ch)).join('');
    chip.onclick = () => {
      chip.classList.add('playing');
      sayWord(word, () => chip.classList.remove('playing'));
    };
    chips.appendChild(chip);
  });

  app.querySelector('#say-name').onclick = () => play('name/' + p.letter, p.nameSay);
  app.querySelector('#say-sound').onclick = () => play('sound/' + p.letter, p.soundSay);
  app.querySelector('#say-word').onclick = () => sayWord(p.keyword);

  if(prev) app.querySelector('#prev-letter').onclick = () => go('letter', { letter:prev.letter });
  if(next) app.querySelector('#next-letter').onclick = () => go('letter', { letter:next.letter });
}

  app.querySelector('#reset-btn').onclick = () => {

/* Frame switcher. Presentation only — it changes the size of the
   preview shell on a laptop, never the app's behaviour. Hidden by CSS
   on real touch devices, where the app already fills the display. */
(function setupFrameToggle(){
  const toggle = document.getElementById('frame-toggle');
  const device = document.getElementById('device');
  if(!toggle || !device) return;

  let choice = 'phone';
  try{ choice = localStorage.getItem('sproutreads.frame') || 'phone'; }catch(e){}
  apply(choice);

  toggle.addEventListener('click', e => {
    const btn = e.target.closest('button[data-frame]');
    if(btn) apply(btn.dataset.frame);
  });

  function apply(frame){
    device.classList.toggle('tablet', frame === 'tablet');
    device.classList.toggle('phone', frame !== 'tablet');
    toggle.querySelectorAll('button[data-frame]').forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.frame === frame)));
    try{ localStorage.setItem('sproutreads.frame', frame); }catch(e){}
  }
})();

document.getElementById('pip-widget').addEventListener('click', () => {
  const tips = LIBRARY.ui.pipTips || PACK_EN.ui.pipTips;
  pipSay(tips[Math.floor(Math.random() * tips.length)], 'cheer');
});

// Stop any narration if the demo is backgrounded mid-sentence.
document.addEventListener('visibilitychange', () => { if(document.hidden) stopAll(); });
